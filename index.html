<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>งานของฝ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef2f7; --surface:#ffffff; --sunk:#f6f8fb; --ink:#142033; --muted:#4b5a6e; --line:#d3dbe6;
  --folder:#1e4e8c; --folder-ink:#ffffff; --folder-soft:#e3ecf8;
  --late:#b42318; --late-soft:#fdecea; --today:#a64708; --today-soft:#fdf0e3;
  --done:#2b7a4b; --done-soft:#e5f3ea;
  --focus:#2f6fd0; --shadow:0 1px 2px rgba(20,32,51,.06),0 4px 16px rgba(20,32,51,.06);
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --z-head:20; --z-backdrop:30; --z-drawer:40; --z-login:50; --z-toast:60;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0f1724; --surface:#172234; --sunk:#131d2c; --ink:#e7edf6; --muted:#a8b5c7; --line:#2b3a52;
    --folder:#6c9ee6; --folder-ink:#0b1422; --folder-soft:#1d2d47;
    --late:#ff8a7a; --late-soft:#3a1c1c; --today:#f4a85f; --today-soft:#3a2716;
    --done:#73c495; --done-soft:#17301f; --focus:#8bb5f5; --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1724; --surface:#172234; --sunk:#131d2c; --ink:#e7edf6; --muted:#a8b5c7; --line:#2b3a52;
  --folder:#6c9ee6; --folder-ink:#0b1422; --folder-soft:#1d2d47;
  --late:#ff8a7a; --late-soft:#3a1c1c; --today:#f4a85f; --today-soft:#3a2716;
  --done:#73c495; --done-soft:#17301f; --focus:#8bb5f5; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* ปุ่มและช่องกรอก */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:44px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-weight:500;transition:background-color .18s,border-color .18s,color .18s}
.btn:hover:not(:disabled){background:var(--sunk);border-color:var(--muted)}
.btn.primary{background:var(--folder);border-color:var(--folder);color:var(--folder-ink)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--folder) 86%,#000)}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 40%,var(--line))}
.btn.danger:hover:not(:disabled){background:var(--late-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.icon{width:44px;padding:0}
.field{display:grid;gap:4px;font-size:14px;font-weight:500;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:16px;font-weight:400}
textarea.input{min-height:96px;resize:vertical;line-height:1.55}
.input:hover{border-color:var(--muted)}

/* หน้าเข้าสู่ระบบ */
.login{position:fixed;inset:0;z-index:var(--z-login);display:grid;place-items:center;padding:24px;background:var(--paper)}
.login.overlay{background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(3px)}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:32px 28px;display:grid;gap:18px;justify-items:start}
.login-card h1{margin:0;font-size:26px;line-height:1.3;font-weight:700}
.login-card p{margin:0;color:var(--muted)}
.login-msg{color:var(--late);font-weight:500}
.login-cal{display:flex;gap:8px}
.login-cal .cal{width:58px;height:64px}

/* ส่วนหัว */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-head);background:var(--folder);color:var(--folder-ink)}
.top-in{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:20px;font-weight:700;flex:1;min-width:0}
.top .who{font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.top .btn{color:var(--folder-ink);border-color:transparent;background:transparent}
.top .btn:hover:not(:disabled){background:color-mix(in srgb,var(--folder-ink) 14%,transparent)}

main{max-width:920px;margin:0 auto;padding:16px 16px 64px}

/* เพิ่มงานด่วน */
.quick{display:grid;grid-template-columns:1fr auto auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;box-shadow:var(--shadow)}
.quick .input{border-color:transparent;background:var(--sunk)}
.quick #q-title{font-size:17px}
.quick-more{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:0 4px}
.quick-more .btn{min-height:36px;font-size:14px;white-space:nowrap}

/* แท็บและตัวกรอง */
.tabs{display:flex;gap:4px;margin:20px 0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{min-height:44px;padding:0 14px;border:0;background:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .18s,border-color .18s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--folder);border-bottom-color:var(--folder)}
.tab .n{font-weight:500;font-size:13px;margin-left:4px;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.filters select{flex:1 1 150px;max-width:220px}
.search{position:relative;flex:3 1 240px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:38px}

/* รายการงาน */
.group{margin-top:22px}
.group h2{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.group h2 .n{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.group.g-late h2{color:var(--late)}
.group.g-today h2{color:var(--today)}
.list{display:grid;gap:6px}
.task{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);transition:border-color .18s,background-color .18s}
.task:hover{border-color:var(--muted)}
.task.is-pending{opacity:.6;pointer-events:none}
.check{flex:none;width:52px;border:0;background:none;display:grid;place-items:center;color:transparent;border-radius:var(--r-md) 0 0 var(--r-md)}
.check::before{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;transition:background-color .18s,border-color .18s}
.check{position:relative}
.check:hover:not(:disabled)::before{border-color:var(--done);background:var(--done-soft)}
.check:hover:not(:disabled){color:var(--done)}
.check svg{position:relative;width:15px;height:15px;stroke-width:3}
.task.is-done .check::before{background:var(--done);border-color:var(--done)}
.task.is-done .check{color:#fff}
.open{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:10px 14px 10px 0;border:0;background:none;text-align:left}

/* ปฏิทินฉีก: จุดเด่นของหน้า */
.cal{flex:none;width:50px;height:56px;border-radius:7px;background:var(--sunk);border:1px solid var(--line);display:grid;grid-template-rows:7px 1fr auto;overflow:hidden;text-align:center;line-height:1}
.cal::before{content:"";background:var(--folder)}
.cal-d{align-self:end;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cal-m{font-size:12px;font-weight:500;color:var(--muted);padding:2px 0 6px}
.cal.is-late{background:var(--late-soft);border-color:color-mix(in srgb,var(--late) 35%,var(--line))}
.cal.is-late::before{background:var(--late)}
.cal.is-late .cal-d{color:var(--late)}
.cal.is-today{background:var(--today-soft);border-color:color-mix(in srgb,var(--today) 35%,var(--line))}
.cal.is-today::before{background:var(--today)}
.cal.is-today .cal-d{color:var(--today)}
.cal.is-none{grid-template-rows:7px 1fr}
.cal.is-none .cal-m{align-self:center;padding:0;font-size:11px;line-height:1.25}
.cal.is-done::before{background:var(--done)}

.t-body{display:grid;gap:4px;min-width:0}
.t-title{font-size:16px;font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.task.is-done .t-title{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);align-items:center}
.t-meta>span{display:inline-flex;align-items:center;gap:4px}
.t-meta .late{color:var(--late);font-weight:600}
.t-meta .today{color:var(--today);font-weight:600}
.t-meta .urgent{color:var(--late);font-weight:600}
.person{display:inline-flex;align-items:center;gap:5px}
.person i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.status{padding:1px 8px;border-radius:999px;background:var(--folder-soft);color:var(--folder);font-weight:500}
.status.s-wait{background:var(--today-soft);color:var(--today)}
.carry{padding:1px 8px;border-radius:999px;border:1px dashed var(--muted);color:var(--muted)}
.seg{display:flex;gap:4px;padding:4px;min-height:48px;flex:none;background:var(--sunk);border-radius:var(--r-md);overflow-x:auto}
.seg-b{flex:1;min-height:40px;padding:0 8px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:600;white-space:nowrap;transition:background-color .18s,color .18s}
.seg-b:hover{color:var(--ink)}
.seg-b[aria-selected="true"]{background:var(--surface);color:var(--folder);box-shadow:0 1px 2px rgba(20,32,51,.12)}
.adm{display:grid;gap:16px}
.rows{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-md)}
.rows li{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-top:1px solid var(--line);min-height:56px}
.rows li:first-child{border-top:0}
.rows li.off{opacity:.6}
.r-main{flex:1;min-width:0;display:grid;gap:2px}
.r-main strong{font-weight:600}
.r-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pill{padding:0 8px;border-radius:999px;background:var(--folder-soft);color:var(--folder);font-size:12px;font-weight:600}
.pill.muted{background:var(--sunk);color:var(--muted)}
.rows .empty-row{color:var(--muted);font-size:14px}
.empty{margin:40px auto;max-width:420px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.more-note{margin-top:14px;font-size:14px;color:var(--muted)}
.skel{height:78px;border-radius:var(--r-md);background:linear-gradient(90deg,var(--surface),var(--sunk),var(--surface));background-size:200% 100%;animation:sh 1.2s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

/* แผงรายละเอียด */
.backdrop{position:fixed;inset:0;z-index:var(--z-backdrop);background:rgba(10,18,30,.38)}
.drawer{position:fixed;z-index:var(--z-drawer);top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);box-shadow:-8px 0 32px rgba(10,18,30,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.dr-head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--line)}
.dr-head h2{margin:0;flex:1;font-size:18px;font-weight:600}
.dr-body{flex:1;overflow-y:auto;padding:18px 20px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:6px;min-width:0}
legend{font-size:14px;font-weight:500;color:var(--muted);padding:0;margin-bottom:6px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:15px;cursor:pointer;transition:background-color .18s,border-color .18s}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){background:var(--folder-soft);border-color:var(--folder);color:var(--folder);font-weight:500}
.pick label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.pick i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.foot{font-size:13px;color:var(--muted)}
.link-out{display:inline-flex;align-items:center;gap:6px;color:var(--folder);font-weight:500;overflow-wrap:anywhere}

.notes h3{margin:0 0 10px;font-size:16px;font-weight:600}
.timeline{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:0}
.timeline li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}
.timeline li:last-child{border-left-color:transparent}
.timeline li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.timeline li.n-note::before{background:var(--folder);border-color:var(--folder)}
.timeline li.n-due::before{border-color:var(--today)}
.timeline .who{font-size:13px;color:var(--muted)}
.timeline .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.timeline li.n-sys .txt{color:var(--muted);font-size:14px}
.divider{height:1px;background:var(--line);margin:4px 0}

.panel{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:grid;gap:8px}
.panel h3{margin:0;font-size:15px;font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter span{display:block;height:100%;background:var(--folder)}
pre.preview{margin:0;min-height:160px;white-space:pre-wrap;font:inherit;font-size:14px;background:var(--sunk);border-radius:var(--r-md);padding:12px;max-height:340px;overflow:auto}

.toast{position:fixed;z-index:var(--z-toast);left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:8px 8px 8px 16px;border-radius:var(--r-md);box-shadow:var(--shadow);font-size:15px}
.toast .btn{min-height:36px;background:transparent;color:inherit;border-color:color-mix(in srgb,var(--paper) 40%,transparent)}
.toast.err{background:var(--late);color:#fff}

@media (max-width:640px){
  .top .who{display:none}
  .quick{grid-template-columns:1fr auto}
  .quick #q-title{grid-column:1/-1}
  .quick-more{justify-content:flex-end}
  .quick-more span{display:none}
  .filters select{max-width:none}
  .row2{grid-template-columns:1fr}
  .check{width:46px}
  .open{gap:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="login-card">
    <div class="login-cal" aria-hidden="true">
      <div class="cal is-late"><span class="cal-d">3</span><span class="cal-m">ต.ค.</span></div>
      <div class="cal is-today"><span class="cal-d">5</span><span class="cal-m">ต.ค.</span></div>
      <div class="cal"><span class="cal-d">9</span><span class="cal-m">ต.ค.</span></div>
    </div>
    <h1 id="login-title">งานของฝ่าย</h1>
    <p id="login-text">เข้าสู่ระบบด้วยบัญชี Google ที่ผู้ดูแลเพิ่มไว้ในระบบ</p>
    <div id="gsi-btn"></div>
    <p id="login-msg" class="login-msg" role="alert"></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <h1>งานของฝ่าย</h1>
      <span class="who" id="who"></span>
      <button class="btn icon" id="b-admin" hidden aria-label="ตั้งค่าระบบ" title="ตั้งค่าระบบ"></button>
      <button class="btn icon" id="b-reload" aria-label="โหลดข้อมูลใหม่" title="โหลดข้อมูลใหม่"></button>
      <button class="btn icon" id="b-logout" aria-label="ออกจากระบบ" title="ออกจากระบบ"></button>
    </div>
  </header>

  <main>
    <form id="quick" class="quick" autocomplete="off">
      <label class="sr" for="q-title">ชื่องานใหม่</label>
      <input class="input" id="q-title" placeholder="งานใหม่ พิมพ์ชื่องานแล้วกด Enter" maxlength="200">
      <label class="sr" for="q-due">กำหนดส่ง</label>
      <input class="input" id="q-due" type="date">
      <button class="btn primary" id="q-add" type="submit"></button>
      <div class="quick-more">
        <span>งานจะอยู่ในชื่อของคุณ แก้ผู้รับผิดชอบได้ภายหลัง</span>
        <button class="btn ghost" type="button" id="q-more">ใส่รายละเอียดเพิ่ม</button>
      </div>
    </form>

    <nav class="tabs" role="tablist" aria-label="มุมมองงาน">
      <button class="tab" role="tab" data-tab="mine">งานของฉัน<span class="n" id="n-mine"></span></button>
      <button class="tab" role="tab" data-tab="all">งานทั้งฝ่าย<span class="n" id="n-all"></span></button>
      <button class="tab" role="tab" data-tab="done">ปิดแล้ว</button>
    </nav>

    <div class="filters">
      <label class="sr" for="f-term">ภาคเรียน</label>
      <select class="input" id="f-term" hidden></select>
      <label class="sr" for="f-user">กรองตามคน</label>
      <select class="input" id="f-user"></select>
      <label class="sr" for="f-tag">กรองตามแท็ก</label>
      <select class="input" id="f-tag"></select>
      <div class="search">
        <label class="sr" for="f-q">ค้นหางาน</label>
        <span id="search-ic"></span>
        <input class="input" id="f-q" type="search" placeholder="ค้นหาชื่องาน แท็ก หรือที่มา">
      </div>
    </div>

    <section id="list" aria-live="polite"></section>
  </main>
</div>

<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" hidden>
  <div class="dr-head">
    <h2 id="dr-title"></h2>
    <button class="btn icon ghost" id="dr-close" aria-label="ปิด"></button>
  </div>
  <div class="dr-body" id="dr-body"></div>
</aside>

<datalist id="tag-list"></datalist>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwCe1P4F15p9gzCbF2jpyiRaJMb1Wplx5AXhTxgtpwqFsLo3tQ05RfY3kRWP3-Fh-EmRg/exec',
  CLIENT_ID: '277716951356-3ma5t20ke5f8g5l5jh6stbup2ssunja2.apps.googleusercontent.com',
};

const STATUS = ['รอเริ่ม', 'กำลังทำ', 'รอผู้อื่น', 'เสร็จ', 'ยกเลิก'];

const S = { me: null, users: [], tasks: [], terms: [], currentTerm: '', term: undefined, admin: null, tab: 'mine', fUser: '', fTag: '', q: '', booted: false };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ───────── วันที่ ───────── */
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dUTC = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const diffDays = (a, b) => Math.round((dUTC(b) - dUTC(a)) / 864e5);
const thaiDate = s => `${+s.slice(8, 10)} ${TH_MONTH[+s.slice(5, 7) - 1]}`;
const thaiDateY = s => `${thaiDate(s)} ${+s.slice(0, 4) + 543}`;
const thaiStamp = s => s ? `${thaiDate(s)} ${s.slice(11, 16)}`.trim() : '';

/* ───────── ผู้ใช้ ───────── */
const userOf = e => S.users.find(u => u.email === e) || { email: e, nick: e.split('@')[0], name: '', active: false };
const activeUsers = () => S.users.filter(u => u.active);
const colorOf = e => COLORS[Math.max(0, S.users.findIndex(u => u.email === e)) % COLORS.length];
const isOpen = t => !CLOSED.includes(t.status);

/* ───────── เข้าสู่ระบบ ───────── */
let idToken = null, tokenExp = 0, waiters = [];

function initGsi() {
  google.accounts.id.initialize({
    client_id: CONFIG.CLIENT_ID,
    callback: onCredential,
    auto_select: true,
    cancel_on_tap_outside: false,
  });
  google.accounts.id.renderButton($('#gsi-btn'), { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', locale: 'th' });
  google.accounts.id.prompt();
}

function onCredential(resp) {
  idToken = resp.credential;
  try {
    const payload = JSON.parse(atob(idToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    tokenExp = payload.exp || 0;
  } catch (_) { tokenExp = 0; }
  $('#login-msg').textContent = '';
  if (waiters.length) {
    hideLogin();
    const w = waiters; waiters = [];
    w.forEach(fn => fn(idToken));
  } else if (!S.booted) {
    boot();
  } else {
    hideLogin();
  }
}

function showLogin(msg, overlay) {
  const box = $('#login');
  box.classList.toggle('overlay', !!overlay);
  $('#login-msg').textContent = msg || '';
  box.hidden = false;
  try { google.accounts.id.prompt(); } catch (_) {}
}
function hideLogin() { $('#login').hidden = true; }

function getToken() {
  if (idToken && Date.now() / 1000 < tokenExp - 60) return Promise.resolve(idToken);
  idToken = null;
  return new Promise(res => {
    waiters.push(res);
    showLogin('เซสชันหมดอายุ เข้าสู่ระบบอีกครั้งเพื่อทำต่อ', S.booted);
  });
}

async function api(action, data) {
  const token = await getToken();
  let json;
  try {
    const r = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, data, token }),
    });
    json = await r.json();
  } catch (_) {
    throw new Error('เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง');
  }
  if (json.ok) return json.data;
  if (json.code === 'AUTH') {
    idToken = null;
    return new Promise(res => {
      waiters.push(() => res(api(action, data)));
      showLogin(json.error, S.booted);
    });
  }
  if (json.code === 'FORBIDDEN' && !S.booted) {
    google.accounts.id.disableAutoSelect();
    idToken = null;
    showLogin(json.error);
    throw Object.assign(new Error(json.error), { silent: true });
  }
  throw new Error(json.error || 'เกิดข้อผิดพลาด');
}

function applyLoad(d) {
  S.users = d.users; S.tasks = d.tasks;
  S.terms = d.terms; S.currentTerm = d.currentTerm; S.term = d.term;
}

async function boot() {
  hideLogin();
  $('#app').hidden = false;
  renderSkeleton();
  try {
    const d = await api('load', { term: S.term });
    S.me = d.me; S.booted = true;
    applyLoad(d);
    $('#who').textContent = S.me.nick;
    $('#b-admin').hidden = !S.me.isAdmin;
    fillFilters();
    render();
  } catch (e) {
    if (e.silent) { $('#app').hidden = true; return; }
    $('#list').innerHTML = `<div class="empty"><strong>โหลดข้อมูลไม่สำเร็จ</strong>${esc(e.message)}</div>`;
  }
}

async function reload() {
  const b = $('#b-reload'); b.disabled = true;
  try {
    applyLoad(await api('load', { term: S.term }));
    fillFilters(); render();
  } catch (e) { toast(e.message, { error: true }); }
  finally { b.disabled = false; }
}

function logout() {
  google.accounts.id.disableAutoSelect();
  idToken = null; S.booted = false;
  $('#app').hidden = true;
  closeDrawer();
  showLogin('');
}

/* ───────── รายการงาน ───────── */
function fillFilters() {
  const keepU = S.fUser, keepT = S.fTag;
  const termSel = $('#f-term');
  termSel.hidden = !S.terms.length;
  termSel.innerHTML = S.terms.slice().reverse().map(t =>
    `<option value="${esc(t.name)}">${esc(t.name)}${t.name === S.currentTerm ? ' (ปัจจุบัน)' : ''}</option>`).join('') +
    '<option value="*">ทุกภาคเรียน</option>';
  termSel.value = S.term;
  $('#f-user').innerHTML = '<option value="">ทุกคน</option>' + activeUsers().map(u => `<option value="${esc(u.email)}">${esc(u.nick)}</option>`).join('');
  const tags = [...new Set(S.tasks.flatMap(t => t.tags))].sort((a, b) => a.localeCompare(b, 'th'));
  $('#f-tag').innerHTML = '<option value="">ทุกแท็ก</option>' + tags.map(t => `<option>${esc(t)}</option>`).join('');
  $('#tag-list').innerHTML = tags.map(t => `<option value="${esc(t)}">`).join('');
  $('#f-user').value = activeUsers().some(u => u.email === keepU) ? keepU : '';
  $('#f-tag').value = tags.includes(keepT) ? keepT : '';
  S.fUser = $('#f-user').value; S.fTag = $('#f-tag').value;
}

function visible() {
  let list = S.tasks;
  if (S.tab === 'mine') list = list.filter(t => isOpen(t) && t.assignees.includes(S.me.email));
  else if (S.tab === 'all') list = list.filter(isOpen);
  else list = list.filter(t => !isOpen(t));
  if (S.fUser && S.tab !== 'mine') list = list.filter(t => t.assignees.includes(S.fUser));
  if (S.fTag) list = list.filter(t => t.tags.includes(S.fTag));
  if (S.q) {
    const q = S.q.toLowerCase();
    list = list.filter(t => [t.title, t.detail, t.source, t.tags.join(' ')].join(' ').toLowerCase().includes(q));
  }
  return list;
}

function bucket(t, today) {
  if (!t.due) return 'none';
  const d = diffDays(today, t.due);
  return d < 0 ? 'late' : d === 0 ? 'today' : d <= 7 ? 'week' : 'later';
}

function render() {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  $('#n-mine').textContent = S.tasks.filter(t => isOpen(t) && t.assignees.includes(S.me.email)).length;
  $('#n-all').textContent = S.tasks.filter(isOpen).length;
  $('#f-user').hidden = S.tab === 'mine';

  const today = todayISO();
  const list = visible();
  const box = $('#list');

  if (!list.length) {
    const filtered = S.q || S.fTag || (S.fUser && S.tab !== 'mine');
    box.innerHTML = filtered
      ? '<div class="empty"><strong>ไม่พบงานที่ตรงกับตัวกรอง</strong>ลองล้างคำค้นหรือเปลี่ยนตัวกรอง</div>'
      : S.tab === 'done'
        ? '<div class="empty"><strong>ยังไม่มีงานที่ปิดแล้วในภาคเรียนนี้</strong>กดช่องหน้าชื่องานเพื่อปิดงานที่ทำเสร็จ</div>'
        : '<div class="empty"><strong>ไม่มีงานค้าง</strong>พิมพ์ชื่องานในช่องด้านบนเพื่อเพิ่มงานใหม่</div>';
    return;
  }

  if (S.tab === 'done') {
    const sorted = list.slice().sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
    box.innerHTML = `<div class="list">${sorted.slice(0, 100).map(t => row(t, today)).join('')}</div>` +
      (sorted.length > 100 ? `<p class="more-note">แสดง 100 งานล่าสุดจากทั้งหมด ${sorted.length} งาน ใช้ช่องค้นหาเพื่อหางานเก่า</p>` : '');
    return;
  }

  const groups = [['late', 'เลยกำหนด'], ['today', 'ครบกำหนดวันนี้'], ['week', 'ภายใน 7 วัน'], ['later', 'หลังจากนั้น'], ['none', 'ยังไม่กำหนดวัน']];
  const sortFn = (a, b) => (a.due || '').localeCompare(b.due || '') || (P_RANK[a.priority] ?? 2) - (P_RANK[b.priority] ?? 2) || a.createdAt.localeCompare(b.createdAt);
  box.innerHTML = groups.map(([key, label]) => {
    const items = list.filter(t => bucket(t, today) === key).sort(sortFn);
    if (!items.length) return '';
    return `<section class="group g-${key}"><h2>${label}<span class="n">${items.length} งาน</span></h2><div class="list">${items.map(t => row(t, today)).join('')}</div></section>`;
  }).join('');
}

function row(t, today) {
  const open = isOpen(t);
  const d = t.due ? diffDays(today, t.due) : null;
  const calCls = !open ? 'is-done' : d === null ? 'is-none' : d < 0 ? 'is-late' : d === 0 ? 'is-today' : '';
  const cal = t.due
    ? `<span class="cal ${calCls}" aria-hidden="true"><span class="cal-d">${+t.due.slice(8, 10)}</span><span class="cal-m">${TH_MONTH[+t.due.slice(5, 7) - 1]}</span></span>`
    : `<span class="cal ${calCls || 'is-none'}" aria-hidden="true"><span class="cal-m">ไม่มี<br>กำหนด</span></span>`;

  const meta = [];
  if (open && d !== null && d < 0) meta.push(`<span class="late">เลยกำหนด ${-d} วัน</span>`);
  else if (open && d === 0) meta.push('<span class="today">ครบกำหนดวันนี้</span>');
  else if (t.due) meta.push(`<span class="sr">กำหนดส่ง ${thaiDate(t.due)}</span>`);
  if (!open) meta.push(`<span>${esc(t.status)} ${t.doneAt ? thaiDate(t.doneAt) : ''}</span>`);
  meta.push(...t.assignees.map(e => `<span class="person" style="--c:${colorOf(e)}"><i></i>${esc(userOf(e).nick)}</span>`));
  if (open && t.term && S.term !== '*' && t.term !== S.term) meta.push(`<span class="carry">ยกมาจาก ${esc(t.term)}</span>`);
  if (open && t.status !== 'รอเริ่ม') meta.push(`<span class="status ${t.status === 'รอผู้อื่น' ? 's-wait' : ''}">${esc(t.status)}</span>`);
  if (t.priority && t.priority !== 'ปกติ') meta.push(`<span class="urgent">${icon('flag')}${esc(t.priority)}</span>`);
  if (t.repeat) meta.push(`<span>${icon('repeat')}${esc(t.repeat)}</span>`);
  if (t.noteCount) meta.push(`<span>${icon('note')}${t.noteCount}<span class="sr"> บันทึก</span></span>`);
  t.tags.forEach(tag => meta.push(`<span>#${esc(tag)}</span>`));

  return `<article class="task ${open ? '' : 'is-done'}" data-id="${esc(t.id)}">
    <button class="check" data-act="toggle" aria-label="${open ? 'ปิดงาน' : 'เปิดงานอีกครั้ง'} ${esc(t.title)}">${icon('check')}</button>
    <button class="open" data-act="open">${cal}<span class="t-body"><span class="t-title">${esc(t.title)}</span><span class="t-meta">${meta.join('')}</span></span></button>
  </article>`;
}

function renderSkeleton() {
  $('#list').innerHTML = '<div class="group"><div class="list">' + '<div class="skel"></div>'.repeat(4) + '</div></div>';
}

function upsert(task) {
  const i = S.tasks.findIndex(t => t.id === task.id);
  if (i >= 0) S.tasks[i] = Object.assign({}, S.tasks[i], task);
  else S.tasks.push(Object.assign({ noteCount: 0 }, task));
}

async function toggle(id) {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const el = document.querySelector(`.task[data-id="${CSS.escape(id)}"]`);
  el && el.classList.add('is-pending');
  const prev = t.status;
  const status = isOpen(t) ? 'เสร็จ' : 'กำลังทำ';
  try {
    const r = await api('setStatus', { id, status });
    upsert(r.task);
    if (r.next) upsert(r.next);
    render();
    if (status === 'เสร็จ') {
      toast(r.next ? `ปิดงานแล้ว และสร้างรอบถัดไป ${thaiDate(r.next.due)}` : 'ปิดงานแล้ว', {
        action: 'เลิกทำ',
        onAction: async () => {
          const u = await api('setStatus', { id, status: prev, removeId: r.next ? r.next.id : '' });
          upsert(u.task);
          if (r.next) S.tasks = S.tasks.filter(x => x.id !== r.next.id);
          render();
          toast('เปิดงานกลับแล้ว');
        },
      });
    } else toast('เปิดงานอีกครั้งแล้ว');
  } catch (e) {
    el && el.classList.remove('is-pending');
    toast(e.message, { error: true });
  }
}

/* ───────── แผงรายละเอียด ───────── */
let lastFocus = null;

function openDrawer(title, html) {
  lastFocus = document.activeElement;
  $('#dr-title').textContent = title;
  $('#dr-body').innerHTML = html;
  $('#drawer').hidden = false;
  $('#backdrop').hidden = false;
  document.body.style.overflow = 'hidden';
  const first = $('#dr-body').querySelector('input,select,textarea,button');
  first && first.focus({ preventScroll: true });
}

function closeDrawer() {
  if ($('#drawer').hidden) return;
  $('#drawer').hidden = true;
  $('#backdrop').hidden = true;
  document.body.style.overflow = '';
  lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
}

function options(list, value) {
  return list.map(o => {
    const [v, label] = Array.isArray(o) ? o : [o, o];
    return `<option value="${esc(v)}" ${v === value ? 'selected' : ''}>${esc(label)}</option>`;
  }).join('');
}

function peoplePicker(selected, disabled) {
  return `<div class="pick">${S.users.filter(u => u.active || selected.includes(u.email)).map(u => `<label style="--c:${colorOf(u.email)}"><input type="checkbox" name="assignee" value="${esc(u.email)}" ${selected.includes(u.email) ? 'checked' : ''} ${disabled ? 'disabled' : ''}><i></i>${esc(u.nick)}</label>`).join('')}</div>`;
}

function formFields(t) {
  const dis = '';
  return `
    <label class="field">ชื่องาน<input class="input" id="f-title" value="${esc(t.title)}" maxlength="200" ${dis}></label>
    <fieldset><legend>ผู้รับผิดชอบ</legend>${peoplePicker(t.assignees)}</fieldset>
    <div class="row2">
      <label class="field">ความเร่งด่วน<select class="input" id="f-priority" ${dis}>${options(PRIORITY, t.priority || 'ปกติ')}</select></label>
      <label class="field">ทำซ้ำ<select class="input" id="f-repeat" ${dis}>${options(REPEAT, t.repeat || '')}</select></label>
    </div>
    ${S.terms.length ? `<label class="field">ภาคเรียน<select class="input" id="f-term-task" ${dis}>${options([['', 'ไม่ระบุ']].concat(S.terms.slice().reverse().map(x => [x.name, x.name])), t.term || '')}</select></label>` : ''}
    <label class="field">แท็ก (คั่นด้วยจุลภาค)<input class="input" id="f-tags" list="tag-list" value="${esc(t.tags.join(', '))}" placeholder="เช่น ปพ., สอบปลายภาค" ${dis}></label>
    <label class="field">ที่มาของงาน<input class="input" id="f-source" value="${esc(t.source)}" placeholder="เช่น คำสั่งที่ 123/2569 หรือ ผู้มอบหมาย" ${dis}></label>
    <label class="field">ลิงก์เอกสาร<input class="input" id="f-link" type="url" value="${esc(t.link)}" placeholder="https://" ${dis}></label>
    <label class="field">รายละเอียด<textarea class="input" id="f-detail" ${dis}>${esc(t.detail)}</textarea></label>`;
}

function readFields() {
  const f = {
    title: $('#f-title').value.trim(),
    assignees: [...document.querySelectorAll('input[name="assignee"]:checked')].map(i => i.value),
    priority: $('#f-priority').value,
    repeat: $('#f-repeat').value,
    tags: $('#f-tags').value.split(',').map(s => s.trim()).filter(Boolean),
    source: $('#f-source').value.trim(),
    link: $('#f-link').value.trim(),
    detail: $('#f-detail').value.trim(),
  };
  if ($('#f-term-task')) f.term = $('#f-term-task').value;
  return f;
}

function checkFields(f, due) {
  if (!f.title) return 'กรุณาใส่ชื่องาน';
  if (!f.assignees.length) return 'เลือกผู้รับผิดชอบอย่างน้อย 1 คน';
  if (f.repeat && !due) return 'งานที่ทำซ้ำต้องมีกำหนดส่ง';
  if (f.link && !/^https?:\/\//i.test(f.link)) return 'ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://';
  return '';
}

function openNew(title, due) {
  const blank = { title: title || '', assignees: [S.me.email], priority: 'ปกติ', repeat: '', tags: [], source: '', link: '', detail: '', term: S.currentTerm };
  openDrawer('เพิ่มงานใหม่', `
    ${formFields(blank)}
    <label class="field">กำหนดส่ง<input class="input" id="f-due" type="date" value="${esc(due || '')}"></label>
    <div class="actions"><button class="btn primary" id="b-create">${icon('plus')}เพิ่มงาน</button></div>`);
  $('#b-create').onclick = async e => {
    const btn = e.currentTarget;
    const f = readFields();
    const due = $('#f-due').value;
    const msg = checkFields(f, due);
    if (msg) return toast(msg, { error: true });
    btn.disabled = true;
    try {
      const r = await api('create', Object.assign(f, { due }));
      upsert(r.task); fillFilters(); render(); closeDrawer();
      toast('เพิ่มงานแล้ว');
    } catch (err) { toast(err.message, { error: true }); btn.disabled = false; }
  };
}

function openTask(id) {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const creator = userOf(t.createdBy).nick;
  openDrawer('รายละเอียดงาน', `
    <div class="row2">
      <label class="field">สถานะ<select class="input" id="f-status">${options(STATUS, t.status)}</select></label>
      <div class="field">กำหนดส่ง<input class="input" id="f-due" type="date" value="${esc(t.due)}"></div>
    </div>
    ${formFields(t)}
    ${t.link ? `<a class="link-out" href="${esc(t.link)}" target="_blank" rel="noopener">${icon('link')}เปิดลิงก์เอกสาร</a>` : ''}
    <div class="actions"><button class="btn primary" id="b-save">บันทึกการแก้ไข</button></div>
    <div class="divider"></div>
    <section class="notes">
      <h3>บันทึกความคืบหน้า</h3>
      <ol class="timeline" id="timeline"><li class="n-sys"><span class="txt">กำลังโหลด…</span></li></ol>
      <label class="field">เพิ่มบันทึก<textarea class="input" id="f-note" placeholder="เช่น ส่งร่างให้หัวหน้าตรวจแล้ว รอตอบกลับ"></textarea></label>
      <div class="actions"><button class="btn" id="b-note">${icon('note')}เพิ่มบันทึก</button></div>
    </section>
    <div class="divider"></div>
    <p class="foot">สร้างโดย ${esc(creator)} เมื่อ ${esc(thaiStamp(t.createdAt))}${t.doneAt ? ` และ${esc(t.status)}โดย ${esc(userOf(t.doneBy).nick)} เมื่อ ${esc(thaiStamp(t.doneAt))}` : ''}</p>
    <div class="actions"><button class="btn danger" id="b-del">${icon('trash')}ลบงานนี้</button></div>`);

  loadNotes(id);

  $('#f-status').onchange = async e => {
    const sel = e.currentTarget;
    sel.disabled = true;
    try {
      const r = await api('setStatus', { id, status: sel.value });
      upsert(r.task);
      if (r.next) upsert(r.next);
      render(); loadNotes(id);
      toast(r.next ? `บันทึกสถานะแล้ว และสร้างรอบถัดไป ${thaiDate(r.next.due)}` : 'บันทึกสถานะแล้ว');
    } catch (err) { sel.value = t.status; toast(err.message, { error: true }); }
    sel.disabled = false;
  };

  // เปลี่ยนกำหนดส่งแล้วบันทึกทันที ประวัติการเปลี่ยนยังเก็บไว้ในไทม์ไลน์
  const dueInput = $('#f-due');
  dueInput.onchange = async () => {
    const due = dueInput.value;
    const cur = S.tasks.find(x => x.id === id).due;
    if (due === cur) return;
    dueInput.disabled = true;
    try {
      const r = await api('changeDue', { id, due });
      upsert(r.task); render(); loadNotes(id);
      toast(due ? `เปลี่ยนกำหนดส่งเป็น ${thaiDate(due)} แล้ว` : 'ยกเลิกกำหนดส่งแล้ว');
    } catch (err) { dueInput.value = cur; toast(err.message, { error: true }); }
    dueInput.disabled = false;
  };

  $('#b-save').onclick = async e => {
    const btn = e.currentTarget;
    const f = readFields();
    const msg = checkFields(f, S.tasks.find(x => x.id === id).due);
    if (msg) return toast(msg, { error: true });
    btn.disabled = true;
    try {
      const r = await api('update', { id, fields: f });
      upsert(r.task); fillFilters(); render(); loadNotes(id);
      toast('บันทึกการแก้ไขแล้ว');
    } catch (err) { toast(err.message, { error: true }); }
    btn.disabled = false;
  };

  $('#b-note').onclick = async e => {
    const btn = e.currentTarget;
    const text = $('#f-note').value.trim();
    if (!text) return toast('พิมพ์ข้อความก่อนกดเพิ่มบันทึก', { error: true });
    btn.disabled = true;
    try {
      await api('addNote', { id, text });
      const task = S.tasks.find(x => x.id === id);
      task.noteCount = (task.noteCount || 0) + 1;
      $('#f-note').value = '';
      render(); loadNotes(id);
    } catch (err) { toast(err.message, { error: true }); }
    btn.disabled = false;
  };

  const del = $('#b-del');
  if (del) del.onclick = async () => {
    if (!confirm(`ลบงาน "${t.title}" และบันทึกทั้งหมดของงานนี้? ลบแล้วกู้คืนไม่ได้`)) return;
    del.disabled = true;
    try {
      await api('remove', { id });
      S.tasks = S.tasks.filter(x => x.id !== id);
      fillFilters(); render(); closeDrawer();
      toast('ลบงานแล้ว');
    } catch (err) { toast(err.message, { error: true }); del.disabled = false; }
  };
}

async function loadNotes(id) {
  const box = $('#timeline');
  if (!box) return;
  try {
    const notes = await api('notes', { id });
    if ($('#timeline') !== box) return;
    box.innerHTML = notes.length ? notes.map(n => {
      const cls = n.type === 'บันทึก' ? 'n-note' : n.type === 'กำหนดส่ง' ? 'n-due' : 'n-sys';
      return `<li class="${cls}"><div class="who">${esc(userOf(n.by).nick)} เวลา ${esc(thaiStamp(n.at))}</div><div class="txt">${esc(n.text)}</div></li>`;
    }).join('') : '<li class="n-sys"><span class="txt">ยังไม่มีบันทึก</span></li>';
  } catch (e) {
    box.innerHTML = `<li class="n-sys"><span class="txt">โหลดบันทึกไม่สำเร็จ: ${esc(e.message)}</span></li>`;
  }
}

/* ───────── ตั้งค่าระบบ (ผู้ดูแล) ───────── */
const ADMIN_TABS = [['users', 'ผู้ใช้งาน'], ['terms', 'ภาคเรียน'], ['holidays', 'วันหยุด'], ['notify', 'แจ้งเตือน']];
const WEEKDAYS = [[1, 'จันทร์'], [2, 'อังคาร'], [3, 'พุธ'], [4, 'พฤหัสบดี'], [5, 'ศุกร์'], [6, 'เสาร์'], [7, 'อาทิตย์']];
let adminTab = 'users';

async function openAdmin(tab) {
  adminTab = tab || adminTab;
  openDrawer('ตั้งค่าระบบ', `
    <div class="seg" role="tablist" aria-label="หมวดการตั้งค่า">${ADMIN_TABS.map(([k, l]) => `<button class="seg-b" role="tab" data-k="${k}">${l}</button>`).join('')}</div>
    <div id="adm" class="adm"><p class="foot">กำลังโหลด…</p></div>`);
  $('#dr-body .seg').onclick = e => {
    const b = e.target.closest('.seg-b');
    if (b && S.admin) { adminTab = b.dataset.k; renderAdmin(); }
  };
  markAdminTab();
  try {
    S.admin = await api('adminData');
    renderAdmin();
  } catch (e) {
    $('#adm').innerHTML = `<p class="foot">${esc(e.message)}</p>`;
  }
}

function markAdminTab() {
  document.querySelectorAll('.seg-b').forEach(b => b.setAttribute('aria-selected', String(b.dataset.k === adminTab)));
}

function renderAdmin(arg) {
  if (!$('#adm')) return;
  markAdminTab();
  ({ users: admUsers, terms: admTerms, holidays: admHolidays, notify: admNotify })[adminTab](arg);
}

async function adminSave(action, data, btn, msg) {
  if (btn) btn.disabled = true;
  try {
    S.admin = await api(action, data);
    renderAdmin();
    toast(msg);
    reload();
  } catch (e) {
    toast(e.message, { error: true });
    if (btn) btn.disabled = false;
  }
}

      <p class="foot">ดูตัวอย่างได้ฟรี ไม่ใช้โควตาข้อความ</p>
      <div class="actions"><button class="btn" id="pv-daily">ข้อความรายวัน</button><button class="btn" id="pv-weekly">สรุปรายสัปดาห์</button></div>
      <pre class="preview" id="pv-box" hidden></pre>
    </div>
    <div class="panel">
      <h3>ส่งตอนนี้</h3>
      <p class="foot">ใช้สำหรับทดสอบ การส่งแต่ละครั้งใช้โควตาเท่ากับจำนวนสมาชิกในกลุ่ม</p>
      <div class="actions"><button class="btn" id="send-daily">${icon('send')}ส่งข้อความรายวัน</button><button class="btn" id="send-weekly">${icon('send')}ส่งสรุปรายสัปดาห์</button></div>
    </div>`;

  const here = $('#s-here');
  if (here) here.onclick = () => { $('#s-url').value = location.origin + location.pathname.replace(/index\.html$/, ''); };
  $('#s-save').onclick = e => adminSave('saveSettings', {
    dailyHour: $('#s-dh').value, dueSoonDays: $('#s-soon').value,
    weeklyDay: $('#s-wd').value, weeklyHour: $('#s-wh').value,
    webUrl: $('#s-url').value.trim(),
  }, e.currentTarget, 'บันทึกเวลาส่งแล้ว');
  $('#s-token-save').onclick = e => {
    const token = $('#s-token').value.trim();
    if (!token) return toast('วางรหัสก่อนกดบันทึก', { error: true });
    adminSave('setLineToken', { token }, e.currentTarget, 'บันทึกรหัส LINE แล้ว');
  };

  const preview = async kind => {
    const box = $('#pv-box');
    box.hidden = false; box.textContent = 'กำลังสร้างข้อความ…';
    try { const p = await api('preview'); box.textContent = p[kind]; }
    catch (err) { box.textContent = err.message; }
  };
  $('#pv-daily').onclick = () => preview('daily');
  $('#pv-weekly').onclick = () => preview('weekly');

  const send = async (kind, btn) => {
    if (!confirm('ส่งข้อความเข้ากลุ่ม LINE ตอนนี้? จะใช้โควตาข้อความของเดือนนี้')) return;
    btn.disabled = true;
    try {
      const r = await api('sendNow', { kind });
      toast(r.sent ? 'ส่งข้อความแล้ว' : 'วันนี้ไม่มีงานที่ต้องแจ้ง จึงไม่ได้ส่ง');
      lineStatus();
    } catch (err) { toast(err.message, { error: true }); }
    btn.disabled = false;
  };
  $('#send-daily').onclick = e => send('daily', e.currentTarget);
  $('#send-weekly').onclick = e => send('weekly', e.currentTarget);

  lineStatus();
}

async function lineStatus(action) {
  const box = $('#line-status');
  if (!box) return;
  try {
    const s = await api(action || 'lineStatus');
    if (!$('#line-status')) return;
    const parts = ['<h3>กลุ่ม LINE</h3>'];
    if (!s.tokenSet) {
      parts.push('<p class="foot">ใส่รหัสเชื่อมต่อ LINE ด้านบนก่อน</p>');
    } else {
      parts.push(s.groupId
        ? `<p>ส่งแจ้งเตือนเข้ากลุ่ม <strong>${esc(s.groupName || 'ไม่ทราบชื่อกลุ่ม')}</strong></p>`
        : '<p>ยังไม่ได้เลือกกลุ่ม เชิญบอทเข้ากลุ่ม LINE ของฝ่ายแล้วกลับมาที่หน้านี้</p>');
      if (s.seenGroupId) {
        parts.push(`<p>พบกลุ่ม <strong>${esc(s.seenGroupName || 'ไม่ทราบชื่อ')}</strong> ตรวจว่าเป็นกลุ่มของฝ่ายก่อนกดใช้</p>
          <div class="actions"><button class="btn primary" id="b-use-group">ใช้กลุ่มนี้</button></div>`);
      }
      if (s.used != null) {
        const pct = s.quota ? Math.min(100, Math.round(s.used / s.quota * 100)) : 0;
        parts.push(`<p class="foot">เดือนนี้ใช้ไป ${s.used}${s.quota ? ` จาก ${s.quota}` : ''} ข้อความ</p>` +
          (s.quota ? `<div class="meter" role="img" aria-label="ใช้โควตาไป ${pct}%"><span style="width:${pct}%"></span></div>` : ''));
      }
      if (s.error) parts.push(`<p class="foot">${esc(s.error)}</p>`);
    }
    box.innerHTML = parts.join('');
    const use = $('#b-use-group');
    if (use) use.onclick = () => { use.disabled = true; lineStatus('useSeenGroup'); };
  } catch (e) {
    box.innerHTML = `<h3>กลุ่ม LINE</h3><p class="foot">${esc(e.message)}</p>`;
  }
}

/* ───────── แจ้งผล ───────── */
let toastTimer = null;
function toast(msg, opt = {}) {
  const el = $('#toast');
  clearTimeout(toastTimer);
  el.className = 'toast' + (opt.error ? ' err' : '');
  el.innerHTML = `<span>${esc(msg)}</span>` + (opt.action ? `<button class="btn">${esc(opt.action)}</button>` : '');
  el.hidden = false;
  if (opt.action) el.querySelector('button').onclick = async () => {
    el.hidden = true;
    try { await opt.onAction(); } catch (e) { toast(e.message, { error: true }); }
  };
  toastTimer = setTimeout(() => { el.hidden = true; }, opt.action ? 6000 : opt.error ? 5000 : 2500);
}

/* ───────── เชื่อมเหตุการณ์ ───────── */
$('#b-admin').innerHTML = icon('gear');
$('#b-reload').innerHTML = icon('reload');
$('#b-logout').innerHTML = icon('logout');
$('#dr-close').innerHTML = icon('x');
$('#q-add').innerHTML = icon('plus') + 'เพิ่ม';
$('#search-ic').innerHTML = icon('search');

$('#quick').addEventListener('submit', async e => {
  e.preventDefault();
  const title = $('#q-title').value.trim();
  if (!title) return $('#q-title').focus();
  const btn = $('#q-add');
  btn.disabled = true;
  try {
    const r = await api('create', { title, due: $('#q-due').value });
    upsert(r.task); render();
    $('#q-title').value = ''; $('#q-due').value = '';
    toast('เพิ่มงานแล้ว');
  } catch (err) { toast(err.message, { error: true }); }
  btn.disabled = false;
  $('#q-title').focus();
});
$('#q-more').onclick = () => openNew($('#q-title').value.trim(), $('#q-due').value);

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  S.tab = b.dataset.tab; render();
});
$('#f-user').onchange = e => { S.fUser = e.target.value; render(); };
$('#f-tag').onchange = e => { S.fTag = e.target.value; render(); };
$('#f-q').oninput = e => { S.q = e.target.value.trim(); render(); };

$('#list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = b.closest('.task').dataset.id;
  if (b.dataset.act === 'toggle') toggle(id);
  else openTask(id);
});

$('#b-logout').onclick = logout;
$('#b-admin').onclick = () => openAdmin();
$('#f-term').onchange = async e => {
  S.term = e.target.value;
  renderSkeleton();
  await reload();
};
$('#dr-close').onclick = closeDrawer;
$('#backdrop').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.booted && $('#drawer').hidden) reload();
});
