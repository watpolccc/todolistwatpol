<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>งานของฝ่าย</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://accounts.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Trirong:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* สมุดทะเบียนคุมงาน: กระดาษเขียวอ่อน หมึกตราประทับสีคราม */
:root{
  --paper:#e9efe6; --sheet:#fbfdf9; --sunk:#f0f5ed; --ink:#17241f; --muted:#52635a; --rule:#c8d4c6;
  --stamp:#343c9c; --stamp-ink:#ffffff; --stamp-soft:#e3e5f6;
  --late:#b3261e; --late-soft:#fbe6e3; --today:#8a4b00; --today-soft:#fbeed8;
  --done:#256b43; --done-soft:#dff0e4;
  --focus:#4a54c8; --lift:0 12px 40px rgba(23,36,31,.16);
  --r:8px; --r-in:6px;
  --serif:"Trirong","Sarabun","Leelawadee UI",serif;
  --z-backdrop:30; --z-drawer:40; --z-login:50; --z-toast:60;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111915; --sheet:#19241f; --sunk:#151f1a; --ink:#e6eee8; --muted:#a3b3aa; --rule:#2f3f37;
    --stamp:#a6adf7; --stamp-ink:#12163a; --stamp-soft:#262b57;
    --late:#ff9085; --late-soft:#3b1d1a; --today:#f0ad62; --today-soft:#3a2814;
    --done:#7cc79a; --done-soft:#18301f; --focus:#a6adf7; --lift:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111915; --sheet:#19241f; --sunk:#151f1a; --ink:#e6eee8; --muted:#a3b3aa; --rule:#2f3f37;
  --stamp:#a6adf7; --stamp-ink:#12163a; --stamp-soft:#262b57;
  --late:#ff9085; --late-soft:#3b1d1a; --today:#f0ad62; --today-soft:#3a2814;
  --done:#7cc79a; --done-soft:#18301f; --focus:#a6adf7; --lift:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 "Sarabun","Leelawadee UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* ปุ่มและช่องกรอก */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);font-weight:600;transition:background-color .16s,border-color .16s}
.btn:hover:not(:disabled){background:var(--sunk);border-color:var(--muted)}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--stamp-ink)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--stamp) 86%,#000);border-color:transparent}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 40%,var(--rule))}
.btn.danger:hover:not(:disabled){background:var(--late-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.icon{width:44px;padding:0}
.field{display:grid;gap:4px;font-size:15px;font-weight:500;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--rule);border-radius:var(--r-in);background:var(--sheet);color:var(--ink);font-size:17px;font-weight:400}
textarea.input{min-height:96px;resize:vertical;line-height:1.55}
.input:hover{border-color:var(--muted)}

/* หน้าเข้าสู่ระบบ */
.login{position:fixed;inset:0;z-index:var(--z-login);display:grid;place-items:center;padding:24px;background:var(--paper)}
.login.overlay{background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(3px)}
.login-card{width:min(420px,100%);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:32px 28px;display:grid;gap:16px;justify-items:start}
.login-card h1{margin:0;font:700 32px/1.25 var(--serif)}
.login-card p{margin:0;color:var(--muted)}
.login-msg{color:var(--late);font-weight:600}
.login-rail{width:120px;display:grid;gap:7px}
.login-rail .track{height:5px}

/* โครงหน้า */
.shell{max-width:1120px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:44px}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;padding:30px 0 20px;display:flex;flex-direction:column;gap:26px}
.brand h1{margin:0;font:700 31px/1.2 var(--serif)}
.brand p{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--muted)}
.sync{display:block;min-height:1.45em;font-size:14px}
.tabs{display:grid;gap:2px}
.tab{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;padding:0 12px;border:0;border-left:3px solid transparent;background:none;color:var(--muted);font-weight:600;text-align:left;white-space:nowrap;transition:color .16s,background-color .16s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--stamp);border-left-color:var(--stamp);background:var(--stamp-soft)}
.tab .n{font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:2px;padding-top:12px;border-top:1px solid var(--rule)}
.who{flex:1;min-width:0;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{min-width:0;padding:30px 0 72px}

/* เพิ่มงานใหม่ */
.quick{display:grid;gap:10px;padding:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.quick-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.quick #q-title{font-size:18px;border-color:transparent;background:var(--sunk)}
.quick-when{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.range{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.range .input{width:auto;min-height:40px;padding:4px 10px;font-size:16px}
.quick-when .btn{min-height:40px;font-size:15px}

/* ตัวกรอง */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.filters select{flex:1 1 150px;max-width:220px}
.search{position:relative;flex:3 1 240px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:38px}

/* รายการงาน: แผ่นทะเบียนมีเส้นบรรทัด */
.group{margin-top:28px}
.group h2{margin:0 0 8px;font:600 20px/1.3 var(--serif);display:flex;gap:10px;align-items:baseline}
.group h2 .n{font:400 15px/1 "Sarabun",sans-serif;color:var(--muted);font-variant-numeric:tabular-nums}
.group.g-late h2{color:var(--late)}
.group.g-today h2{color:var(--today)}
.list{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
#list>.list{margin-top:20px}
.task{display:flex;align-items:stretch;border-top:1px solid var(--rule);transition:background-color .16s}
.task:first-child{border-top:0}
.task:hover{background:var(--sunk)}
.task.is-pending{opacity:.55;pointer-events:none}
.check{position:relative;flex:none;width:50px;border:0;background:none;display:grid;place-items:center;color:transparent}
.check::before{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--muted);border-radius:5px;transition:background-color .16s,border-color .16s}
.check:hover:not(:disabled)::before{border-color:var(--done);background:var(--done-soft)}
.check:hover:not(:disabled){color:var(--done)}
.check svg{position:relative;width:15px;height:15px;stroke-width:3}
.task.is-done .check::before{background:var(--done);border-color:var(--done)}
.task.is-done .check{color:var(--sheet)}
.open{flex:1;min-width:0;display:flex;align-items:stretch;gap:16px;padding:0 16px 0 0;border:0;background:none;text-align:left}
.check:focus-visible,.open:focus-visible{outline-offset:-3px}

/* คอลัมน์วันที่: วันกำหนดส่ง วันเริ่ม และแถบบอกว่าผ่านช่วงทำงานมาเท่าไร */
.when{flex:none;width:104px;padding:12px 12px 12px 0;border-right:1px solid var(--rule);display:grid;gap:3px;align-content:center}
.when-d{font:700 20px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.when-s{font-size:13.5px;line-height:1.3;color:var(--muted)}
.track{display:block;height:4px;margin-top:2px;border-radius:2px;background:var(--rule);overflow:hidden}
.track i{display:block;height:100%;background:var(--stamp)}
.when.is-late .when-d{color:var(--late)}
.when.is-late .track i,.track.is-late i{background:var(--late)}
.when.is-today .when-d{color:var(--today)}
.when.is-today .track i,.track.is-today i{background:var(--today)}
.when.is-done .when-d{color:var(--muted)}
.when.is-done .track i{background:var(--done)}

.t-body{display:grid;gap:3px;min-width:0;padding:12px 0;align-content:center}
.t-title{font-size:17px;font-weight:500;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.task.is-done .t-title{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--muted);align-items:center}
.t-meta>span{display:inline-flex;align-items:center;gap:4px}
.t-meta .late{color:var(--late);font-weight:600}
.t-meta .today{color:var(--today);font-weight:600}
.t-meta .urgent{padding:0 6px;border:1.5px solid currentColor;border-radius:4px;color:var(--late);font-size:13px;font-weight:700;line-height:1.5;transform:rotate(-2deg)}
.person{display:inline-flex;align-items:center;gap:5px}
.person i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.status{padding:0 8px;border-radius:4px;background:var(--stamp-soft);color:var(--stamp);font-weight:600}
.status.s-wait{background:var(--today-soft);color:var(--today)}
.carry{padding:0 8px;border-radius:4px;border:1px dashed var(--muted);color:var(--muted)}
.empty{margin:48px auto;max-width:420px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:600 20px/1.4 var(--serif);margin-bottom:4px}
.more-note{margin-top:14px;font-size:15px;color:var(--muted)}
.skel{height:70px;border-top:1px solid var(--rule);background:linear-gradient(90deg,var(--sheet),var(--sunk),var(--sheet));background-size:200% 100%;animation:sh 1.2s infinite linear}
.skel:first-child{border-top:0}
@keyframes sh{to{background-position:-200% 0}}

/* ตั้งค่าระบบ */
.seg{display:flex;gap:4px;padding:4px;min-height:48px;flex:none;background:var(--sunk);border-radius:var(--r);overflow-x:auto}
.seg-b{flex:1;min-height:40px;padding:0 8px;border:0;border-radius:var(--r-in);background:none;color:var(--muted);font-weight:600;white-space:nowrap;transition:background-color .16s,color .16s}
.seg-b:hover{color:var(--ink)}
.seg-b[aria-selected="true"]{background:var(--sheet);color:var(--stamp);box-shadow:0 0 0 1px var(--rule)}
.adm{display:grid;gap:16px}
.rows{list-style:none;margin:0;padding:0;border:1px solid var(--rule);border-radius:var(--r)}
.rows li{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-top:1px solid var(--rule);min-height:56px}
.rows li:first-child{border-top:0}
.rows li.off{opacity:.6}
.r-main{flex:1;min-width:0;display:grid;gap:2px}
.r-main strong{font-weight:600}
.r-sub{font-size:14px;color:var(--muted);overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pill{padding:0 8px;border-radius:4px;background:var(--stamp-soft);color:var(--stamp);font-size:13px;font-weight:600}
.pill.muted{background:var(--sunk);color:var(--muted)}
.rows .empty-row{color:var(--muted);font-size:15px}
.panel{border:1px solid var(--rule);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.panel h3{margin:0;font-size:16px;font-weight:600}
.panel p{margin:0}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--rule)}
.meter span{display:block;height:100%;background:var(--stamp)}
pre.preview{margin:0;min-height:160px;white-space:pre-wrap;font:inherit;font-size:15px;background:var(--sunk);border-radius:var(--r);padding:12px;max-height:340px;overflow:auto}

/* แผงรายละเอียด */
.backdrop{position:fixed;inset:0;z-index:var(--z-backdrop);background:rgba(15,26,21,.42)}
.drawer{position:fixed;z-index:var(--z-drawer);top:0;right:0;bottom:0;width:min(560px,100%);background:var(--sheet);border-left:1px solid var(--rule);box-shadow:var(--lift);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.dr-head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--rule)}
.dr-head h2{margin:0;flex:1;font:600 21px/1.3 var(--serif)}
.dr-body{flex:1;overflow-y:auto;padding:18px 20px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:6px;min-width:0}
legend{font-size:15px;font-weight:500;color:var(--muted);padding:0;margin-bottom:6px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--rule);border-radius:var(--r-in);font-size:16px;cursor:pointer;transition:background-color .16s,border-color .16s}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){background:var(--stamp-soft);border-color:var(--stamp);color:var(--stamp);font-weight:600}
.pick label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.pick i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.foot{margin:0;font-size:14px;color:var(--muted)}
.link-out{display:inline-flex;align-items:center;gap:6px;color:var(--stamp);font-weight:600;overflow-wrap:anywhere}
.notes h3{margin:0 0 10px;font:600 18px/1.3 var(--serif)}
.timeline{list-style:none;margin:0 0 12px;padding:0}
.timeline li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--rule);margin-left:6px}
.timeline li:last-child{border-left-color:transparent}
.timeline li::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--sheet);border:2px solid var(--muted)}
.timeline li.n-note::before{background:var(--stamp);border-color:var(--stamp)}
.timeline li.n-due::before{border-color:var(--today)}
.timeline .who{font-size:14px;color:var(--muted)}
.timeline .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.timeline li.n-sys .txt{color:var(--muted);font-size:15px}
.divider{height:1px;background:var(--rule);margin:4px 0}

.toast{position:fixed;z-index:var(--z-toast);left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:8px 8px 8px 16px;border-radius:var(--r);box-shadow:var(--lift);font-size:16px}
.toast span{padding:4px 8px 4px 0}
.toast .btn{min-height:36px;background:transparent;color:inherit;border-color:color-mix(in srgb,var(--paper) 40%,transparent)}
.toast.err{background:var(--late);color:var(--sheet)}

@media (max-width:820px){
  .shell{display:block;padding:0 16px}
  .side{position:static;height:auto;padding:14px 0 0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:10px 8px}
  .brand h1{font-size:25px}
  .brand p{margin-top:2px}
  .side-foot{grid-column:2;grid-row:1;margin:0;padding:0;border:0}
  .who{display:none}
  .tabs{grid-column:1/-1;display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto}
  .tab{border-left:0;border-bottom:3px solid transparent;margin-bottom:-1px;justify-content:flex-start}
  .tab[aria-selected="true"]{border-bottom-color:var(--stamp);background:none}
  main{padding-top:16px}
}
@media (max-width:560px){
  .range{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr)}
  .range .input{width:100%}
  .quick-when .btn{margin-left:auto}
  .filters select{max-width:none}
  .row2{grid-template-columns:1fr}
  .check{width:44px}
  .open{gap:12px;padding-right:12px}
  .when{width:82px;padding-right:8px}
  .when-d{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="login-card">
    <div class="login-rail" aria-hidden="true">
      <span class="track is-late"><i style="width:100%"></i></span>
      <span class="track is-today"><i style="width:68%"></i></span>
      <span class="track"><i style="width:30%"></i></span>
    </div>
    <h1 id="login-title">งานของฝ่าย</h1>
    <p id="login-text">เข้าสู่ระบบด้วยบัญชี Google ที่ผู้ดูแลเพิ่มไว้ในระบบ</p>
    <div id="gsi-btn"></div>
    <p id="login-msg" class="login-msg" role="alert"></p>
  </div>
</div>

<div id="app" hidden>
  <div class="shell">
    <header class="side">
      <div class="brand">
        <h1>งานของฝ่าย</h1>
        <p><span id="today-line"></span><span id="sync" class="sync" role="status"></span></p>
      </div>
      <nav class="tabs" role="tablist" aria-label="มุมมองงาน">
        <button class="tab" role="tab" data-tab="mine">งานของฉัน<span class="n" id="n-mine"></span></button>
        <button class="tab" role="tab" data-tab="all">งานทั้งฝ่าย<span class="n" id="n-all"></span></button>
        <button class="tab" role="tab" data-tab="done">ปิดแล้ว</button>
      </nav>
      <div class="side-foot">
        <span class="who" id="who"></span>
        <button class="btn icon ghost" id="b-admin" hidden aria-label="ตั้งค่าระบบ" title="ตั้งค่าระบบ"></button>
        <button class="btn icon ghost" id="b-reload" aria-label="โหลดข้อมูลใหม่" title="โหลดข้อมูลใหม่"></button>
        <button class="btn icon ghost" id="b-logout" aria-label="ออกจากระบบ" title="ออกจากระบบ"></button>
      </div>
    </header>

    <main>
      <form id="quick" class="quick" autocomplete="off">
        <div class="quick-top">
          <label class="sr" for="q-title">ชื่องานใหม่</label>
          <input class="input" id="q-title" placeholder="งานใหม่ พิมพ์ชื่องานแล้วกด Enter" maxlength="200">
          <button class="btn primary" id="q-add" type="submit"></button>
        </div>
        <div class="quick-when">
          <div class="range">
            <label for="q-start">ทำตั้งแต่</label>
            <input class="input" id="q-start" type="date">
            <label for="q-due">ถึง</label>
            <input class="input" id="q-due" type="date">
          </div>
          <button class="btn ghost" type="button" id="q-more">ใส่รายละเอียดเพิ่ม</button>
        </div>
      </form>

      <div class="filters">
        <label class="sr" for="f-term">ภาคเรียน</label>
        <select class="input" id="f-term" hidden></select>
        <label class="sr" for="f-user">กรองตามคน</label>
        <select class="input" id="f-user"></select>
        <label class="sr" for="f-tag">กรองตามแท็ก</label>
        <select class="input" id="f-tag"></select>
        <div class="search">
          <label class="sr" for="f-q">ค้นหางาน</label>
          <span id="search-ic"></span>
          <input class="input" id="f-q" type="search" placeholder="ค้นหาชื่องาน แท็ก หรือที่มา">
        </div>
      </div>

      <section id="list" aria-live="polite"></section>
    </main>
  </div>
</div>

<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" hidden>
  <div class="dr-head">
    <h2 id="dr-title"></h2>
    <button class="btn icon ghost" id="dr-close" aria-label="ปิด"></button>
  </div>
  <div class="dr-body" id="dr-body"></div>
</aside>

<datalist id="tag-list"></datalist>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwCe1P4F15p9gzCbF2jpyiRaJMb1Wplx5AXhTxgtpwqFsLo3tQ05RfY3kRWP3-Fh-EmRg/exec',
  CLIENT_ID: '277716951356-3ma5t20ke5f8g5l5jh6stbup2ssunja2.apps.googleusercontent.com',
};

const STATUS = ['รอเริ่ม', 'กำลังทำ', 'รอผู้อื่น', 'เสร็จ', 'ยกเลิก'];
const CLOSED = ['เสร็จ', 'ยกเลิก'];
const PRIORITY = ['ด่วนมาก', 'ด่วน', 'ปกติ'];
const P_RANK = { 'ด่วนมาก': 0, 'ด่วน': 1, 'ปกติ': 2 };
const REPEAT = [['', 'ไม่ทำซ้ำ'], ['ทุกสัปดาห์', 'ทุกสัปดาห์'], ['ทุกเดือน', 'ทุกเดือน']];
const COLORS = ['#2f5da8', '#0e7c6b', '#8a4baf', '#b05e14', '#b8325a', '#55702a', '#2b7a99', '#7a5c3e'];
const TH_DAYNAME = ['วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'];
const TH_MONTH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

const ICON = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  reload: '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  note: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  gear: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  pencil: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

const S = { me: null, users: [], tasks: [], terms: [], currentTerm: '', term: undefined, admin: null, tab: 'mine', fUser: '', fTag: '', q: '', booted: false, synced: false, termPicked: false, loadedAt: 0 };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ───────── วันที่ ───────── */
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dUTC = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const diffDays = (a, b) => Math.round((dUTC(b) - dUTC(a)) / 864e5);
const thaiDate = s => `${+s.slice(8, 10)} ${TH_MONTH[+s.slice(5, 7) - 1]}`;
const thaiDateY = s => `${thaiDate(s)} ${+s.slice(0, 4) + 543}`;
const thaiStamp = s => s ? `${thaiDate(s)} ${s.slice(11, 16)}`.trim() : '';
const rangeText = (start, due) => start ? `${thaiDate(start)} ถึง ${thaiDate(due)}` : thaiDate(due);

// ช่วงวันทำงาน: ใส่วันเดียวถือเป็นงานวันเดียว (เก็บเป็นกำหนดส่ง)
function normRange(start, due) {
  if (start && !due) return { start: '', due: start };
  if (start && start > due) return { error: 'วันเริ่มต้องไม่หลังวันกำหนดส่ง' };
  return { start: start === due ? '' : start, due };
}
const savedMsg = (task, start, ok) => !start || task.start === start ? ok : 'บันทึกแล้ว แต่ระบบหลังบ้านยังไม่เก็บวันเริ่ม ต้องอัปเดต Apps Script ก่อน';

/* ───────── เก็บข้อมูลล่าสุดไว้ในเครื่อง เพื่อเปิดหน้าได้ทันที ───────── */
const CACHE_KEY = 'wp.load.v1', TOKEN_KEY = 'wp.token';
const store = {
  get(kind, k) { try { return JSON.parse(window[kind + 'Storage'].getItem(k)); } catch (_) { return null; } },
  set(kind, k, v) { try { window[kind + 'Storage'].setItem(k, JSON.stringify(v)); } catch (_) {} },
  del(kind, k) { try { window[kind + 'Storage'].removeItem(k); } catch (_) {} },
};
let cacheTimer = null;
function queueCache() {
  if (S.termPicked || !S.me) return;
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => store.set('local', CACHE_KEY, {
    me: S.me, users: S.users, tasks: S.tasks, terms: S.terms, currentTerm: S.currentTerm, term: S.term,
  }), 400);
}
const setSync = msg => { $('#sync').textContent = msg; };

/* ───────── ผู้ใช้ ───────── */
const userOf = e => S.users.find(u => u.email === e) || { email: e, nick: e.split('@')[0], name: '', active: false };
const activeUsers = () => S.users.filter(u => u.active);
const colorOf = e => COLORS[Math.max(0, S.users.findIndex(u => u.email === e)) % COLORS.length];
const isOpen = t => !CLOSED.includes(t.status);

/* ───────── เข้าสู่ระบบ ───────── */
let idToken = null, tokenExp = 0, waiters = [], gsiTimer = null, booting = false;

function setToken(tok) {
  idToken = tok;
  try {
    const payload = JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    tokenExp = payload.exp || 0;
  } catch (_) { tokenExp = 0; }
  store.set('session', TOKEN_KEY, tok);
}

function dropSession() {
  try { google.accounts.id.disableAutoSelect(); } catch (_) {}
  idToken = null; S.booted = S.synced = false;
  clearTimeout(cacheTimer);
  store.del('local', CACHE_KEY);
  store.del('session', TOKEN_KEY);
}

function initGsi() {
  google.accounts.id.initialize({
    client_id: CONFIG.CLIENT_ID,
    callback: onCredential,
    auto_select: true,
    cancel_on_tap_outside: false,
  });
  google.accounts.id.renderButton($('#gsi-btn'), { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', locale: 'th' });
  google.accounts.id.prompt();
  // เปิดจากข้อมูลที่เก็บไว้แต่ยังไม่ได้ยืนยันตัวตน ถ้า Google ไม่ล็อกอินให้เอง ให้ขึ้นปุ่มเข้าสู่ระบบ
  if (S.booted && !idToken) gsiTimer = setTimeout(() => {
    if (idToken) return;
    setSync('');
    showLogin('เข้าสู่ระบบเพื่ออัปเดตข้อมูล', true);
  }, 4000);
}

function onCredential(resp) {
  setToken(resp.credential);
  clearTimeout(gsiTimer);
  $('#login-msg').textContent = '';
  if (waiters.length) {
    hideLogin();
    const w = waiters; waiters = [];
    w.forEach(fn => fn(idToken));
  } else if (!S.synced) {
    boot();
  } else {
    hideLogin();
  }
}

function showLogin(msg, overlay) {
  const box = $('#login');
  box.classList.toggle('overlay', !!overlay);
  $('#login-msg').textContent = msg || '';
  box.hidden = false;
  try { google.accounts.id.prompt(); } catch (_) {}
}
function hideLogin() { $('#login').hidden = true; }

function getToken() {
  if (idToken && Date.now() / 1000 < tokenExp - 60) return Promise.resolve(idToken);
  idToken = null;
  return new Promise(res => {
    waiters.push(res);
    showLogin('เซสชันหมดอายุ เข้าสู่ระบบอีกครั้งเพื่อทำต่อ', S.booted);
  });
}

async function api(action, data) {
  const token = await getToken();
  let json;
  try {
    const r = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, data, token }),
    });
    json = await r.json();
  } catch (_) {
    throw new Error('เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง');
  }
  if (json.ok) return json.data;
  if (json.code === 'AUTH') {
    idToken = null;
    return new Promise(res => {
      waiters.push(() => res(api(action, data)));
      showLogin(json.error, S.booted);
    });
  }
  if (json.code === 'FORBIDDEN' && (action === 'load' || !S.booted)) {
    dropSession();
    $('#app').hidden = true;
    closeDrawer();
    showLogin(json.error);
    throw Object.assign(new Error(json.error), { silent: true });
  }
  throw new Error(json.error || 'เกิดข้อผิดพลาด');
}

function applyLoad(d) {
  S.users = d.users; S.tasks = d.tasks;
  S.terms = d.terms; S.currentTerm = d.currentTerm; S.term = d.term;
}

// ไม่ได้เลือกภาคเรียนเอง ให้ระบบเลือกภาคเรียนปัจจุบันให้ทุกครั้ง
async function fetchLoad() {
  const d = await api('load', { term: S.termPicked ? S.term : undefined });
  S.loadedAt = Date.now();
  applyLoad(d);
  return d;
}

function paint() {
  $('#who').textContent = S.me.nick;
  $('#b-admin').hidden = !S.me.isAdmin;
  fillFilters();
  render();
}

async function boot() {
  if (booting) return;
  booting = true;
  hideLogin();
  $('#app').hidden = false;
  if (!S.booted) renderSkeleton();
  setSync('กำลังอัปเดตข้อมูล…');
  try {
    const d = await fetchLoad();
    S.me = d.me; S.booted = S.synced = true;
    paint();
  } catch (e) {
    if (e.silent) return;
    if (S.booted) toast(e.message, { error: true });
    else $('#list').innerHTML = `<div class="empty"><strong>โหลดข้อมูลไม่สำเร็จ</strong>${esc(e.message)}</div>`;
  } finally { booting = false; setSync(''); }
}

async function reload() {
  const b = $('#b-reload'); b.disabled = true;
  setSync('กำลังอัปเดตข้อมูล…');
  try {
    await fetchLoad();
    fillFilters(); render();
  } catch (e) { toast(e.message, { error: true }); }
  finally { b.disabled = false; setSync(''); }
}

function logout() {
  dropSession();
  $('#app').hidden = true;
  closeDrawer();
  showLogin('');
}

/* ───────── รายการงาน ───────── */
function fillFilters() {
  const keepU = S.fUser, keepT = S.fTag;
  const termSel = $('#f-term');
  termSel.hidden = !S.terms.length;
  termSel.innerHTML = S.terms.slice().reverse().map(t =>
    `<option value="${esc(t.name)}">${esc(t.name)}${t.name === S.currentTerm ? ' (ปัจจุบัน)' : ''}</option>`).join('') +
    '<option value="*">ทุกภาคเรียน</option>';
  termSel.value = S.term;
  $('#f-user').innerHTML = '<option value="">ทุกคน</option>' + activeUsers().map(u => `<option value="${esc(u.email)}">${esc(u.nick)}</option>`).join('');
  const tags = [...new Set(S.tasks.flatMap(t => t.tags))].sort((a, b) => a.localeCompare(b, 'th'));
  $('#f-tag').innerHTML = '<option value="">ทุกแท็ก</option>' + tags.map(t => `<option>${esc(t)}</option>`).join('');
  $('#tag-list').innerHTML = tags.map(t => `<option value="${esc(t)}">`).join('');
  $('#f-user').value = activeUsers().some(u => u.email === keepU) ? keepU : '';
  $('#f-tag').value = tags.includes(keepT) ? keepT : '';
  S.fUser = $('#f-user').value; S.fTag = $('#f-tag').value;
}

function visible() {
  let list = S.tasks;
  if (S.tab === 'mine') list = list.filter(t => isOpen(t) && t.assignees.includes(S.me.email));
  else if (S.tab === 'all') list = list.filter(isOpen);
  else list = list.filter(t => !isOpen(t));
  if (S.fUser && S.tab !== 'mine') list = list.filter(t => t.assignees.includes(S.fUser));
  if (S.fTag) list = list.filter(t => t.tags.includes(S.fTag));
  if (S.q) {
    const q = S.q.toLowerCase();
    list = list.filter(t => [t.title, t.detail, t.source, t.tags.join(' ')].join(' ').toLowerCase().includes(q));
  }
  return list;
}

function bucket(t, today) {
  if (!t.due) return 'none';
  const d = diffDays(today, t.due);
  return d < 0 ? 'late' : d === 0 ? 'today' : d <= 7 ? 'week' : 'later';
}

function render() {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  $('#n-mine').textContent = S.tasks.filter(t => isOpen(t) && t.assignees.includes(S.me.email)).length;
  $('#n-all').textContent = S.tasks.filter(isOpen).length;
  $('#f-user').hidden = S.tab === 'mine';
  queueCache();

  const today = todayISO();
  const list = visible();
  const box = $('#list');

  if (!list.length) {
    const filtered = S.q || S.fTag || (S.fUser && S.tab !== 'mine');
    box.innerHTML = filtered
      ? '<div class="empty"><strong>ไม่พบงานที่ตรงกับตัวกรอง</strong>ลองล้างคำค้นหรือเปลี่ยนตัวกรอง</div>'
      : S.tab === 'done'
        ? '<div class="empty"><strong>ยังไม่มีงานที่ปิดแล้วในภาคเรียนนี้</strong>กดช่องหน้าชื่องานเพื่อปิดงานที่ทำเสร็จ</div>'
        : '<div class="empty"><strong>ไม่มีงานค้าง</strong>พิมพ์ชื่องานในช่องด้านบนเพื่อเพิ่มงานใหม่</div>';
    return;
  }

  if (S.tab === 'done') {
    const sorted = list.slice().sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
    box.innerHTML = `<div class="list">${sorted.slice(0, 100).map(t => row(t, today)).join('')}</div>` +
      (sorted.length > 100 ? `<p class="more-note">แสดง 100 งานล่าสุดจากทั้งหมด ${sorted.length} งาน ใช้ช่องค้นหาเพื่อหางานเก่า</p>` : '');
    return;
  }

  const groups = [['late', 'เลยกำหนด'], ['today', 'ครบกำหนดวันนี้'], ['week', 'ภายใน 7 วัน'], ['later', 'หลังจากนั้น'], ['none', 'ยังไม่กำหนดวัน']];
  const sortFn = (a, b) => (a.due || '').localeCompare(b.due || '') || (P_RANK[a.priority] ?? 2) - (P_RANK[b.priority] ?? 2) || a.createdAt.localeCompare(b.createdAt);
  box.innerHTML = groups.map(([key, label]) => {
    const items = list.filter(t => bucket(t, today) === key).sort(sortFn);
    if (!items.length) return '';
    return `<section class="group g-${key}"><h2>${label}<span class="n">${items.length} งาน</span></h2><div class="list">${items.map(t => row(t, today)).join('')}</div></section>`;
  }).join('');
}

function row(t, today) {
  const open = isOpen(t);
  const d = t.due ? diffDays(today, t.due) : null;
  const calCls = !open ? 'is-done' : d === null ? '' : d < 0 ? 'is-late' : d === 0 ? 'is-today' : '';
  let cal = '<span class="when" aria-hidden="true"><span class="when-s">ไม่กำหนดวัน</span></span>';
  if (t.due) {
    let sub = '';
    const span = t.start ? diffDays(t.start, t.due) : 0;
    if (span > 0) {
      const pct = open ? Math.max(0, Math.min(100, Math.round(diffDays(t.start, today) / span * 100))) : 100;
      sub = `<span class="when-s">เริ่ม ${thaiDate(t.start)}</span><span class="track"><i style="width:${pct}%"></i></span>`;
    }
    cal = `<span class="when ${calCls}" aria-hidden="true"><span class="when-d">${thaiDate(t.due)}</span>${sub}</span>`;
  }

  const meta = [];
  if (open && d !== null && d < 0) meta.push(`<span class="late">เลยกำหนด ${-d} วัน</span>`);
  else if (open && d === 0) meta.push('<span class="today">ครบกำหนดวันนี้</span>');
  if (t.due) meta.push(`<span class="sr">${t.start ? 'ช่วงวันทำงาน' : 'กำหนดส่ง'} ${rangeText(t.start, t.due)}</span>`);
  if (!open) meta.push(`<span>${esc(t.status)} ${t.doneAt ? thaiDate(t.doneAt) : ''}</span>`);
  meta.push(...t.assignees.map(e => `<span class="person" style="--c:${colorOf(e)}"><i></i>${esc(userOf(e).nick)}</span>`));
  if (open && t.term && S.term !== '*' && t.term !== S.term) meta.push(`<span class="carry">ยกมาจาก ${esc(t.term)}</span>`);
  if (open && t.status !== 'รอเริ่ม') meta.push(`<span class="status ${t.status === 'รอผู้อื่น' ? 's-wait' : ''}">${esc(t.status)}</span>`);
  if (t.priority && t.priority !== 'ปกติ') meta.push(`<span class="urgent">${esc(t.priority)}</span>`);
  if (t.repeat) meta.push(`<span>${icon('repeat')}${esc(t.repeat)}</span>`);
  if (t.noteCount) meta.push(`<span>${icon('note')}${t.noteCount}<span class="sr"> บันทึก</span></span>`);
  t.tags.forEach(tag => meta.push(`<span>#${esc(tag)}</span>`));

  return `<article class="task ${open ? '' : 'is-done'}" data-id="${esc(t.id)}">
    <button class="check" data-act="toggle" aria-label="${open ? 'ปิดงาน' : 'เปิดงานอีกครั้ง'} ${esc(t.title)}">${icon('check')}</button>
    <button class="open" data-act="open">${cal}<span class="t-body"><span class="t-title">${esc(t.title)}</span><span class="t-meta">${meta.join('')}</span></span></button>
  </article>`;
}

function renderSkeleton() {
  $('#list').innerHTML = '<div class="group"><div class="list">' + '<div class="skel"></div>'.repeat(4) + '</div></div>';
}

function upsert(task) {
  const i = S.tasks.findIndex(t => t.id === task.id);
  if (i >= 0) S.tasks[i] = Object.assign({}, S.tasks[i], task);
  else S.tasks.push(Object.assign({ noteCount: 0 }, task));
}

async function toggle(id) {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const el = document.querySelector(`.task[data-id="${CSS.escape(id)}"]`);
  el && el.classList.add('is-pending');
  const prev = t.status;
  const status = isOpen(t) ? 'เสร็จ' : 'กำลังทำ';
  try {
    const r = await api('setStatus', { id, status });
    upsert(r.task);
    if (r.next) upsert(r.next);
    render();
    if (status === 'เสร็จ') {
      toast(r.next ? `ปิดงานแล้ว และสร้างรอบถัดไป ${thaiDate(r.next.due)}` : 'ปิดงานแล้ว', {
        action: 'เลิกทำ',
        onAction: async () => {
          const u = await api('setStatus', { id, status: prev, removeId: r.next ? r.next.id : '' });
          upsert(u.task);
          if (r.next) S.tasks = S.tasks.filter(x => x.id !== r.next.id);
          render();
          toast('เปิดงานกลับแล้ว');
        },
      });
    } else toast('เปิดงานอีกครั้งแล้ว');
  } catch (e) {
    el && el.classList.remove('is-pending');
    toast(e.message, { error: true });
  }
}

/* ───────── แผงรายละเอียด ───────── */
let lastFocus = null;

function openDrawer(title, html) {
  lastFocus = document.activeElement;
  $('#dr-title').textContent = title;
  $('#dr-body').innerHTML = html;
  $('#drawer').hidden = false;
  $('#backdrop').hidden = false;
  document.body.style.overflow = 'hidden';
  const first = $('#dr-body').querySelector('input,select,textarea,button');
  first && first.focus({ preventScroll: true });
}

function closeDrawer() {
  if ($('#drawer').hidden) return;
  $('#drawer').hidden = true;
  $('#backdrop').hidden = true;
  document.body.style.overflow = '';
  lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
}

function options(list, value) {
  return list.map(o => {
    const [v, label] = Array.isArray(o) ? o : [o, o];
    return `<option value="${esc(v)}" ${v === value ? 'selected' : ''}>${esc(label)}</option>`;
  }).join('');
}

function peoplePicker(selected, disabled) {
  return `<div class="pick">${S.users.filter(u => u.active || selected.includes(u.email)).map(u => `<label style="--c:${colorOf(u.email)}"><input type="checkbox" name="assignee" value="${esc(u.email)}" ${selected.includes(u.email) ? 'checked' : ''} ${disabled ? 'disabled' : ''}><i></i>${esc(u.nick)}</label>`).join('')}</div>`;
}

function formFields(t) {
  const dis = '';
  return `
    <label class="field">ชื่องาน<input class="input" id="f-title" value="${esc(t.title)}" maxlength="200" ${dis}></label>
    <fieldset><legend>ผู้รับผิดชอบ</legend>${peoplePicker(t.assignees)}</fieldset>
    <div class="row2">
      <label class="field">ความเร่งด่วน<select class="input" id="f-priority" ${dis}>${options(PRIORITY, t.priority || 'ปกติ')}</select></label>
      <label class="field">ทำซ้ำ<select class="input" id="f-repeat" ${dis}>${options(REPEAT, t.repeat || '')}</select></label>
    </div>
    ${S.terms.length ? `<label class="field">ภาคเรียน<select class="input" id="f-term-task" ${dis}>${options([['', 'ไม่ระบุ']].concat(S.terms.slice().reverse().map(x => [x.name, x.name])), t.term || '')}</select></label>` : ''}
    <label class="field">แท็ก (คั่นด้วยจุลภาค)<input class="input" id="f-tags" list="tag-list" value="${esc(t.tags.join(', '))}" placeholder="เช่น ปพ., สอบปลายภาค" ${dis}></label>
    <label class="field">ที่มาของงาน<input class="input" id="f-source" value="${esc(t.source)}" placeholder="เช่น คำสั่งที่ 123/2569 หรือ ผู้มอบหมาย" ${dis}></label>
    <label class="field">ลิงก์เอกสาร<input class="input" id="f-link" type="url" value="${esc(t.link)}" placeholder="https://" ${dis}></label>
    <label class="field">รายละเอียด<textarea class="input" id="f-detail" ${dis}>${esc(t.detail)}</textarea></label>`;
}

const rangeFields = (start, due) => `
    <fieldset><legend>ช่วงวันทำงาน</legend>
      <div class="row2">
        <label class="field">เริ่ม<input class="input" id="f-start" type="date" value="${esc(start || '')}"></label>
        <label class="field">ถึง (กำหนดส่ง)<input class="input" id="f-due" type="date" value="${esc(due || '')}"></label>
      </div>
      <p class="foot">งานที่ทำวันเดียว ใส่เฉพาะช่องกำหนดส่ง</p>
    </fieldset>`;

function readFields() {
  const f = {
    title: $('#f-title').value.trim(),
    assignees: [...document.querySelectorAll('input[name="assignee"]:checked')].map(i => i.value),
    priority: $('#f-priority').value,
    repeat: $('#f-repeat').value,
    tags: $('#f-tags').value.split(',').map(s => s.trim()).filter(Boolean),
    source: $('#f-source').value.trim(),
    link: $('#f-link').value.trim(),
    detail: $('#f-detail').value.trim(),
  };
  if ($('#f-term-task')) f.term = $('#f-term-task').value;
  return f;
}

function checkFields(f, due) {
  if (!f.title) return 'กรุณาใส่ชื่องาน';
  if (!f.assignees.length) return 'เลือกผู้รับผิดชอบอย่างน้อย 1 คน';
  if (f.repeat && !due) return 'งานที่ทำซ้ำต้องมีกำหนดส่ง';
  if (f.link && !/^https?:\/\//i.test(f.link)) return 'ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://';
  return '';
}

function openNew(title, start, due) {
  const blank = { title: title || '', assignees: [S.me.email], priority: 'ปกติ', repeat: '', tags: [], source: '', link: '', detail: '', term: S.currentTerm };
  openDrawer('เพิ่มงานใหม่', `
    ${formFields(blank)}
    ${rangeFields(start, due)}
    <div class="actions"><button class="btn primary" id="b-create">${icon('plus')}เพิ่มงาน</button></div>`);
  $('#b-create').onclick = async e => {
    const btn = e.currentTarget;
    const f = readFields();
    const rg = normRange($('#f-start').value, $('#f-due').value);
    const msg = rg.error || checkFields(f, rg.due);
    if (msg) return toast(msg, { error: true });
    btn.disabled = true;
    try {
      const r = await api('create', Object.assign(f, { start: rg.start, due: rg.due }));
      upsert(r.task); fillFilters(); render(); closeDrawer();
      toast(savedMsg(r.task, rg.start, 'เพิ่มงานแล้ว'));
    } catch (err) { toast(err.message, { error: true }); btn.disabled = false; }
  };
}

function openTask(id) {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const creator = userOf(t.createdBy).nick;
  openDrawer('รายละเอียดงาน', `
    <label class="field">สถานะ<select class="input" id="f-status">${options(STATUS, t.status)}</select></label>
    ${rangeFields(t.start, t.due)}
    ${formFields(t)}
    ${t.link ? `<a class="link-out" href="${esc(t.link)}" target="_blank" rel="noopener">${icon('link')}เปิดลิงก์เอกสาร</a>` : ''}
    <div class="actions"><button class="btn primary" id="b-save">บันทึกการแก้ไข</button></div>
    <div class="divider"></div>
    <section class="notes">
      <h3>บันทึกความคืบหน้า</h3>
      <ol class="timeline" id="timeline"><li class="n-sys"><span class="txt">กำลังโหลด…</span></li></ol>
      <label class="field">เพิ่มบันทึก<textarea class="input" id="f-note" placeholder="เช่น ส่งร่างให้หัวหน้าตรวจแล้ว รอตอบกลับ"></textarea></label>
      <div class="actions"><button class="btn" id="b-note">${icon('note')}เพิ่มบันทึก</button></div>
    </section>
    <div class="divider"></div>
    <p class="foot">สร้างโดย ${esc(creator)} เมื่อ ${esc(thaiStamp(t.createdAt))}${t.doneAt ? ` และ${esc(t.status)}โดย ${esc(userOf(t.doneBy).nick)} เมื่อ ${esc(thaiStamp(t.doneAt))}` : ''}</p>
    <div class="actions"><button class="btn danger" id="b-del">${icon('trash')}ลบงานนี้</button></div>`);

  loadNotes(id);

  $('#f-status').onchange = async e => {
    const sel = e.currentTarget;
    sel.disabled = true;
    try {
      const r = await api('setStatus', { id, status: sel.value });
      upsert(r.task);
      if (r.next) upsert(r.next);
      render(); loadNotes(id);
      toast(r.next ? `บันทึกสถานะแล้ว และสร้างรอบถัดไป ${thaiDate(r.next.due)}` : 'บันทึกสถานะแล้ว');
    } catch (err) { sel.value = t.status; toast(err.message, { error: true }); }
    sel.disabled = false;
  };

  // เปลี่ยนช่วงวันทำงานแล้วบันทึกทันที ประวัติการเปลี่ยนกำหนดส่งยังเก็บไว้ในไทม์ไลน์
  const startInput = $('#f-start'), dueInput = $('#f-due');
  startInput.onchange = dueInput.onchange = async () => {
    const cur = S.tasks.find(x => x.id === id);
    const curStart = cur.start || '', curDue = cur.due || '';
    const back = () => { startInput.value = curStart; dueInput.value = curDue; };
    if (startInput.value && !dueInput.value) return toast('ใส่วันกำหนดส่งเพื่อบันทึกช่วงวันทำงาน');
    const rg = normRange(startInput.value, dueInput.value);
    if (rg.error) { back(); return toast(rg.error, { error: true }); }
    startInput.value = rg.start;
    if (rg.due === curDue && rg.start === curStart) return;
    startInput.disabled = dueInput.disabled = true;
    try {
      upsert((await api('changeDue', { id, due: rg.due, start: rg.start })).task);
      render(); loadNotes(id);
      toast(savedMsg(S.tasks.find(x => x.id === id), rg.start, rg.due ? `เปลี่ยนวันทำงานเป็น ${rangeText(rg.start, rg.due)} แล้ว` : 'ยกเลิกกำหนดส่งแล้ว'));
    } catch (err) { back(); render(); toast(err.message, { error: true }); }
    startInput.disabled = dueInput.disabled = false;
  };

  $('#b-save').onclick = async e => {
    const btn = e.currentTarget;
    const cur = S.tasks.find(x => x.id === id);
    const f = Object.assign(readFields(), { start: cur.start || '' });
    const msg = checkFields(f, cur.due);
    if (msg) return toast(msg, { error: true });
    btn.disabled = true;
    try {
      const r = await api('update', { id, fields: f });
      upsert(r.task); fillFilters(); render(); loadNotes(id);
      toast('บันทึกการแก้ไขแล้ว');
    } catch (err) { toast(err.message, { error: true }); }
    btn.disabled = false;
  };

  $('#b-note').onclick = async e => {
    const btn = e.currentTarget;
    const text = $('#f-note').value.trim();
    if (!text) return toast('พิมพ์ข้อความก่อนกดเพิ่มบันทึก', { error: true });
    btn.disabled = true;
    try {
      await api('addNote', { id, text });
      const task = S.tasks.find(x => x.id === id);
      task.noteCount = (task.noteCount || 0) + 1;
      $('#f-note').value = '';
      render(); loadNotes(id);
    } catch (err) { toast(err.message, { error: true }); }
    btn.disabled = false;
  };

  const del = $('#b-del');
  if (del) del.onclick = async () => {
    if (!confirm(`ลบงาน "${t.title}" และบันทึกทั้งหมดของงานนี้? ลบแล้วกู้คืนไม่ได้`)) return;
    del.disabled = true;
    try {
      await api('remove', { id });
      S.tasks = S.tasks.filter(x => x.id !== id);
      fillFilters(); render(); closeDrawer();
      toast('ลบงานแล้ว');
    } catch (err) { toast(err.message, { error: true }); del.disabled = false; }
  };
}

async function loadNotes(id) {
  const box = $('#timeline');
  if (!box) return;
  try {
    const notes = await api('notes', { id });
    if ($('#timeline') !== box) return;
    box.innerHTML = notes.length ? notes.map(n => {
      const cls = n.type === 'บันทึก' ? 'n-note' : n.type === 'กำหนดส่ง' ? 'n-due' : 'n-sys';
      return `<li class="${cls}"><div class="who">${esc(userOf(n.by).nick)} เวลา ${esc(thaiStamp(n.at))}</div><div class="txt">${esc(n.text)}</div></li>`;
    }).join('') : '<li class="n-sys"><span class="txt">ยังไม่มีบันทึก</span></li>';
  } catch (e) {
    box.innerHTML = `<li class="n-sys"><span class="txt">โหลดบันทึกไม่สำเร็จ: ${esc(e.message)}</span></li>`;
  }
}

function markAdminTab() {
  document.querySelectorAll('.seg-b').forEach(b => b.setAttribute('aria-selected', String(b.dataset.k === adminTab)));

function renderAdmin(arg) {

async function adminSave(action, data, btn, msg) {

    toast(e.message, { error: true });

}

    if (del && confirm(`ลบภาคเรียน ${del.dataset.del}? ลบได้เฉพาะภาคเรียนที่ยังไม่มีงาน`)) {
      adminSave('deleteTerm', { name: del.dataset.del }, del, 'ลบภาคเรียนแล้ว');
    }
  };
  if (t) $('#t-cancel').onclick = () => admTerms();
  $('#t-save').onclick = e => {
    const data = { name: $('#t-name').value.trim(), start: $('#t-start').value, end: $('#t-end').value, original: t ? t.name : '' };
    if (!data.name || !data.start || !data.end) return toast('กรุณาใส่ชื่อ วันเริ่ม และวันสิ้นสุด', { error: true });
    if (data.start > data.end) return toast('วันเริ่มต้องไม่หลังวันสิ้นสุด', { error: true });
    adminSave('saveTerm', data, e.currentTarget, t ? 'บันทึกภาคเรียนแล้ว' : 'เพิ่มภาคเรียนแล้ว');
  };
}

async function lineStatus(action) {
  const box = $('#line-status');
  if (!box) return;
  try {
    const s = await api(action || 'lineStatus');
    if (!$('#line-status')) return;
    const parts = ['<h3>กลุ่ม LINE</h3>'];
    if (!s.tokenSet) {
      parts.push('<p class="foot">ใส่รหัสเชื่อมต่อ LINE ด้านบนก่อน</p>');
    } else {
      parts.push(s.groupId
        ? `<p>ส่งแจ้งเตือนเข้ากลุ่ม <strong>${esc(s.groupName || 'ไม่ทราบชื่อกลุ่ม')}</strong></p>`
        : '<p>ยังไม่ได้เลือกกลุ่ม เชิญบอทเข้ากลุ่ม LINE ของฝ่ายแล้วกลับมาที่หน้านี้</p>');
      if (s.seenGroupId) {
        parts.push(`<p>พบกลุ่ม <strong>${esc(s.seenGroupName || 'ไม่ทราบชื่อ')}</strong> ตรวจว่าเป็นกลุ่มของฝ่ายก่อนกดใช้</p>
          <div class="actions"><button class="btn primary" id="b-use-group">ใช้กลุ่มนี้</button></div>`);
      }
      if (s.used != null) {
        const pct = s.quota ? Math.min(100, Math.round(s.used / s.quota * 100)) : 0;
        parts.push(`<p class="foot">เดือนนี้ใช้ไป ${s.used}${s.quota ? ` จาก ${s.quota}` : ''} ข้อความ</p>` +
          (s.quota ? `<div class="meter" role="img" aria-label="ใช้โควตาไป ${pct}%"><span style="width:${pct}%"></span></div>` : ''));
      }
      if (s.error) parts.push(`<p class="foot">${esc(s.error)}</p>`);
    }
    box.innerHTML = parts.join('');
    const use = $('#b-use-group');
    if (use) use.onclick = () => { use.disabled = true; lineStatus('useSeenGroup'); };
  } catch (e) {
    box.innerHTML = `<h3>กลุ่ม LINE</h3><p class="foot">${esc(e.message)}</p>`;
  }
}

/* ───────── แจ้งผล ───────── */
let toastTimer = null;
function toast(msg, opt = {}) {
  const el = $('#toast');
  clearTimeout(toastTimer);
  el.className = 'toast' + (opt.error ? ' err' : '');
  el.innerHTML = `<span>${esc(msg)}</span>` + (opt.action ? `<button class="btn">${esc(opt.action)}</button>` : '');
  el.hidden = false;
  if (opt.action) el.querySelector('button').onclick = async () => {
    el.hidden = true;
    try { await opt.onAction(); } catch (e) { toast(e.message, { error: true }); }
  };
  toastTimer = setTimeout(() => { el.hidden = true; }, opt.action ? 6000 : opt.error ? 5000 : 2500);
}
