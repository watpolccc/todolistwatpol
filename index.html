<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>งานของฝ่าย</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e6e9ee">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://accounts.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>

<div id="login" class="login">
  <div class="login-card">
    <span class="logo" aria-hidden="true" style="width:64px;height:64px"></span>
    <h1 id="login-title">งานของฝ่าย</h1>
    <p id="login-text">เข้าสู่ระบบด้วยบัญชี Google ที่ผู้ดูแลเพิ่มไว้ในระบบ</p>
    <div id="gsi-btn"></div>
    <p id="login-msg" class="login-msg" role="alert"></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <span class="logo" aria-hidden="true"></span>
    <div class="brand">
      <h1>งานของฝ่าย</h1>
      <p><span id="today-line"></span><span id="sync" class="sync" role="status"></span></p>
    </div>
    <nav class="tabs" role="tablist" aria-label="เลือกดูงานของใคร">
      <button class="tab" role="tab" data-tab="mine">งานของฉัน<span class="n" id="n-mine"></span></button>
      <button class="tab" role="tab" data-tab="all">งานทั้งฝ่าย<span class="n" id="n-all"></span></button>
    </nav>
    <div class="top-end">
      <span class="who" id="who"></span>
      <button class="btn icon ghost" id="b-admin" hidden aria-label="ตั้งค่าระบบ" title="ตั้งค่าระบบ"></button>
      <button class="btn icon ghost" id="b-reload" aria-label="โหลดข้อมูลใหม่" title="โหลดข้อมูลใหม่"></button>
      <button class="btn icon ghost" id="b-logout" aria-label="ออกจากระบบ" title="ออกจากระบบ"></button>
    </div>
  </header>

  <main>
    <div class="filters">
      <button class="btn primary" id="b-new" type="button"></button>
      <label class="sr" for="f-term">ภาคเรียน</label>
      <select class="input" id="f-term" hidden></select>
      <label class="sr" for="f-user">กรองตามคน</label>
      <select class="input" id="f-user"></select>
      <div class="search">
        <label class="sr" for="f-q">ค้นหางาน</label>
        <span id="search-ic"></span>
        <input class="input" id="f-q" type="search" placeholder="ค้นหาชื่องาน แท็ก หรือที่มา">
      </div>
    </div>
    <div class="chips" id="tag-chips" role="group" aria-label="กรองตามแท็ก" hidden></div>

    <section id="list" aria-live="polite"></section>
  </main>
</div>

<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" hidden>
  <div class="dr-head">
    <h2 id="dr-title"></h2>
    <button class="btn icon ghost" id="dr-close" aria-label="ปิด"></button>
  </div>
  <div class="dr-body" id="dr-body"></div>
</aside>

<datalist id="tag-list"></datalist>
<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js?v=1"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGsi()"></script>
</body>
</html>
